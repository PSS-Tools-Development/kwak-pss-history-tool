services:
  pss-history-tool:
    # Either build from this folder...
    build: .
    # ...or pull the image GitHub Actions publishes on every push (see README):
    # image: ghcr.io/REPLACE_ME/pss-history-tool:latest
    container_name: pss-history-tool
    restart: unless-stopped
    ports:
      - "8080:80"
    labels:
      # Opt-in for Watchtower users: auto-pull the new image after each push.
      - "com.centurylinklabs.watchtower.enable=true"
