server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve the pre-built index.html.gz when the browser accepts gzip (every browser does);
    # nothing is compressed at request time.
    gzip_static on;
    gzip_vary on;

    # "/" -> index.html (internal redirect), which is the whole app.
    location = / {
        index index.html;
    }

    # The page is replaced on every release: browsers may cache it but must revalidate
    # (ETag), so a new deploy shows up on the next reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; return 204; }

    # Anything else -> the app (keeps old bookmarks working).
    location / {
        return 302 /;
    }
}
